name: Lean

on:
  push:
    branches: [main]
    paths:
      - Nyll/**
      - Nyll.lean
      - lakefile.toml
      - lake-manifest.json
      - lean-toolchain
      - .github/workflows/libraries.yml
      - .github/workflows/library-stage.yml
      - .github/workflows/proof-check.yml
      - .github/workflows/cache-release.yml
      - .github/scripts/**
      - tools/check_lean_rules.py
      - tools/cache_sources.py
      - tools/tests/test_check_lean_rules.py
      - AGENTS.md
  pull_request:
    paths:
      - Nyll/**
      - Nyll.lean
      - lakefile.toml
      - lake-manifest.json
      - lean-toolchain
      - .github/workflows/libraries.yml
      - .github/workflows/library-stage.yml
      - .github/workflows/proof-check.yml
      - .github/workflows/cache-release.yml
      - .github/scripts/**
      - tools/check_lean_rules.py
      - tools/cache_sources.py
      - tools/tests/test_check_lean_rules.py
      - AGENTS.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libraries-${{ github.ref }}
  cancel-in-progress: false

# Each job hands its reusable artifacts to the next job before a new runner starts.
# Failed stages stop dependent jobs; partial artifacts are preserved for a later retry.
jobs:
  source-rules:
    name: Check Lean source rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the source checker
        run: python3 -B -m unittest discover -s tools/tests -p test_check_lean_rules.py
      - name: Audit every published source and its import closure
        run: |
          set -euo pipefail
          mkdir -p tmp/ci-source-rules
          python3 -B .github/scripts/publication/ci_templates/generate_manifest.py             --root . --config .github/scripts/proof-manifest-config.json             --manifest tmp/ci-source-rules/modules.json --report tmp/ci-source-rules/audit.json
      - name: Reject new source-rule violations
        # The previously published sources contain existing bare-simp style debt.
        # Preserve that explicit baseline; reject every newly introduced violation.
        # The full source audit above and Lean/NanoDa/axiom checks remain required.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NYLL_STYLE_BASELINE: e33b859d48bcd59154aaf483309d4b83d18119c4
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" ]]; then BASE_SHA="$NYLL_STYLE_BASELINE"; fi
          python3 -B tools/check_lean_rules.py --base "$BASE_SHA"

  depth1-procgroups:
    name: ProCGroups.All
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth1-procgroups
      target: +Nyll.ProCGroups.All

  depth1-valuedfield:
    name: ValuedFieldTheory.All
    needs: depth1-procgroups
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth1-valuedfield
      target: +Nyll.ValuedFieldTheory.All

  depth1-galoiscohomology:
    name: GaloisCohomology.All
    needs: depth1-valuedfield
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth1-galoiscohomology
      target: +Nyll.GaloisCohomology.All

  depth1-schemetheory:
    name: SchemeTheory.All
    needs: depth1-galoiscohomology
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth1-schemetheory
      target: +Nyll.SchemeTheory.All

  depth2-classfield-algebra:
    name: ClassFieldTheory.Algebra
    needs: depth1-schemetheory
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-classfield-algebra
      library: ClassFieldTheory.Algebra

  depth2-classfield-abstractclassfieldtheory:
    name: ClassFieldTheory.AbstractClassFieldTheory
    needs: depth2-classfield-algebra
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-classfield-abstractclassfieldtheory
      library: ClassFieldTheory.AbstractClassFieldTheory

  depth2-classfield-localfieldtheory:
    name: ClassFieldTheory.LocalFieldTheory
    needs: depth2-classfield-abstractclassfieldtheory
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-classfield-localfieldtheory
      library: ClassFieldTheory.LocalFieldTheory

  depth2-classfield-ramificationtheory:
    name: ClassFieldTheory.RamificationTheory
    needs: depth2-classfield-localfieldtheory
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-classfield-ramificationtheory
      library: ClassFieldTheory.RamificationTheory

  depth2-classfield-lubintate:
    name: ClassFieldTheory.LubinTate
    needs: depth2-classfield-ramificationtheory
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-classfield-lubintate
      library: ClassFieldTheory.LubinTate

  depth2-classfield-algebraicnumbertheory:
    name: ClassFieldTheory.AlgebraicNumberTheory
    needs: depth2-classfield-lubintate
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-classfield-algebraicnumbertheory
      library: ClassFieldTheory.AlgebraicNumberTheory

  depth2-classfield-algebraicfunctionfieldtheory:
    name: ClassFieldTheory.AlgebraicFunctionFieldTheory
    needs: depth2-classfield-algebraicnumbertheory
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-classfield-algebraicfunctionfieldtheory
      library: ClassFieldTheory.AlgebraicFunctionFieldTheory

  depth2-classfield-kummertheory:
    name: ClassFieldTheory.KummerTheory
    needs: depth2-classfield-algebraicfunctionfieldtheory
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-classfield-kummertheory
      library: ClassFieldTheory.KummerTheory

  depth2-classfield-localclassfieldtheory-classformation:
    name: ClassFieldTheory.LocalClassFieldTheory.ClassFormation
    needs: depth2-classfield-kummertheory
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-classfield-localclassfieldtheory-classformation
      library: ClassFieldTheory.LocalClassFieldTheory.ClassFormation

  depth2-classfield-localclassfieldtheory-lubintateapplication:
    name: ClassFieldTheory.LocalClassFieldTheory.LubinTateApplication
    needs: depth2-classfield-localclassfieldtheory-classformation
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-classfield-localclassfieldtheory-lubintateapplication
      library: ClassFieldTheory.LocalClassFieldTheory.LubinTateApplication

  depth2-classfield-localclassfieldtheory-finite:
    name: ClassFieldTheory.LocalClassFieldTheory.Finite
    needs: depth2-classfield-localclassfieldtheory-lubintateapplication
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-classfield-localclassfieldtheory-finite
      library: ClassFieldTheory.LocalClassFieldTheory.Finite

  depth2-classfield-localclassfieldtheory:
    name: ClassFieldTheory.LocalClassFieldTheory
    needs: depth2-classfield-localclassfieldtheory-finite
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-classfield-localclassfieldtheory
      library: ClassFieldTheory.LocalClassFieldTheory

  depth2-classfield-globalclassfieldtheory:
    name: ClassFieldTheory.GlobalClassFieldTheory
    needs: depth2-classfield-localclassfieldtheory
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-classfield-globalclassfieldtheory
      library: ClassFieldTheory.GlobalClassFieldTheory

  depth2-classfield-kroneckerweber:
    name: ClassFieldTheory.KroneckerWeber
    needs: depth2-classfield-globalclassfieldtheory
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-classfield-kroneckerweber
      library: ClassFieldTheory.KroneckerWeber

  depth2-classfield:
    name: ClassFieldTheory
    needs: depth2-classfield-kroneckerweber
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-classfield
      library: ClassFieldTheory

  depth2-curves:
    name: AlgebraicCurves.All
    needs: depth2-classfield
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-curves
      target: +Nyll.AlgebraicCurves.All

  depth2-fundamental:
    name: EtaleFundamentalGroups.All
    needs: depth2-curves
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-fundamental
      target: +Nyll.EtaleFundamentalGroups.All

  depth2-cohomology:
    name: EtaleCohomology.All
    needs: depth2-fundamental
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-cohomology
      target: +Nyll.EtaleCohomology.All

  depth2-abelianvarieties:
    name: AbelianVarieties.All
    needs: depth2-cohomology
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-abelianvarieties
      target: +Nyll.AbelianVarieties.All

  depth3-sawin:
    name: SawinTotallyRealTowers.All
    needs: depth2-abelianvarieties
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth3-sawin
      target: +Nyll.SawinTotallyRealTowers.All

  depth3-jacobians:
    name: JacobianVarieties.All
    needs: depth3-sawin
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth3-jacobians
      target: +Nyll.JacobianVarieties.All

  depth3-abfaithful:
    name: Yamaguchi26AbfaithfulGalois.All
    needs: depth3-jacobians
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth3-abfaithful
      target: +Nyll.Yamaguchi26AbfaithfulGalois.All

  depth3-solvable:
    name: Yamaguchi26SolvableCoverings.All
    needs: depth3-abfaithful
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth3-solvable
      target: +Nyll.Yamaguchi26SolvableCoverings.All

  depth3-anabelian:
    name: AnabelianGeometry.All
    needs: depth3-solvable
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth3-anabelian
      target: +Nyll.AnabelianGeometry.All


  all:
    name: All
    needs: depth3-anabelian
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: all
      target: +Nyll

  verify:
    name: NanoDa and strict declaration audit for every library
    # A later successful aggregate does not hide an earlier depth-job failure.
    needs: [depth1-procgroups, depth1-valuedfield, depth1-galoiscohomology,
      depth1-schemetheory, depth2-classfield, depth2-curves, depth2-fundamental,
      depth2-cohomology, depth2-abelianvarieties, depth3-sawin, depth3-jacobians,
      depth3-abfaithful, depth3-solvable, depth3-anabelian, all]
    if: github.event.repository.private == false
    uses: ./.github/workflows/proof-check.yml
    with:
      config: .github/scripts/proof-manifest-config.json
      partition: true
      # Owner requested no additional official kernel replay for NYLL.
      kernel-replay: false
      cache-prefix: nyll-proof-v1

  publish-cache:
    name: Publish verified Lean cache
    needs: [source-rules, verify]
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/cache-release.yml
    with:
      cache-kind: modern
      cache-prefix: nyll-proof-v1
